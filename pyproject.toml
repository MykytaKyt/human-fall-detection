[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urfd-cascade-fall-detection"
version = "0.1.0"
description = "Kinematic cascade (YOLOv8-Pose + DDL + LTC) for posture-anomaly detection, evaluated on UR Fall Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mykyta Kyt", email = "mykyta.kyt@nure.ua" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
pose = ["ultralytics>=8.1"]
vlm = ["openai>=1.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
