name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (CPU-only, no ultralytics)
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -v
      - name: Sanity-check evaluation on committed features
        run: python scripts/train_eval.py --features data/features.parquet
